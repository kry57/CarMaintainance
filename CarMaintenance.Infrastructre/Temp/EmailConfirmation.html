<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Confirm Email</title>
</head>
<body style="margin:0; padding:0; background-color:#1e1e1e; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#1e1e1e; padding: 40px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#1e1e1e;">
                    <tr>
                        <td style="padding: 20px 10px;">
                            <h1 style="color:#ffffff; font-size:24px; margin:0 0 20px;">
                                Hi {{name}},
                            </h1>

                            <p style="color:#e0e0e0; font-size:16px; margin:0 0 30px;">
                                To confirm your email, please click the button below:
                            </p>

                            <table role="presentation" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td align="center" style="border-radius: 6px; background-color:#22c55e;">
                                        <a href="{{action_url}}"
                                           target="_blank"
                                           style="display:inline-block; padding: 14px 32px; font-size:16px; font-weight:bold; color:#ffffff; text-decoration:none; border-radius:6px;">
                                            Verify email address
                                        </a>
                                    </td>
                                </tr>
                            </table>

                            <p style="color:#e0e0e0; font-size:16px; margin:40px 0 0;">
                                Thanks,<br />
                                Car Maintenance Team
                            </p>

                            <hr style="border:none; border-top:1px solid #555555; margin:40px 0;" />

                            <p style="color:#aaaaaa; font-size:13px; margin:0 0 10px;">
                                If you're having trouble with the button above, copy and paste the URL below
                                into your web browser.
                            </p>

                            <p style="color:#8fd7ff; font-size:13px; word-break: break-all; margin:0;">
                                {{action_url}}
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
